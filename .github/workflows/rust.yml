name: Rust release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: vr-imageview.exe.zip

          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: vr-imageview.x64.tar.xz

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: vr-imageview.aarch64.tar.xz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux OpenXR build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libvulkan-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-dri2-0-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            mesa-common-dev

      - name: Build release binary
        run: cargo build --verbose --locked --release --target ${{ matrix.target }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/vr-imageview.exe"
          if (!(Test-Path $binary)) { throw "Missing binary: $binary" }
          Compress-Archive -Path $binary -DestinationPath "${{ matrix.package }}"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          binary="target/${{ matrix.target }}/release/vr-imageview"
          test -f "$binary"
          tar -cJf "${{ matrix.package }}" -C "$(dirname "$binary")" vr-imageview

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true

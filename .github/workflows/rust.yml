name: Rust release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: vr-imageview.exe.zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: vr-imageview.x64.tar.xz
            cross: false
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            package: vr-imageview.aarch64.tar.xz
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --verbose --locked --release --target "${{ matrix.target }}"
          else
            cargo build --verbose --locked --release --target "${{ matrix.target }}"
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/vr-imageview.exe"
          if (!(Test-Path $binary)) { throw "Missing binary: $binary" }
          Compress-Archive -Path $binary -DestinationPath "${{ matrix.package }}"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          binary="target/${{ matrix.target }}/release/vr-imageview"
          test -f "$binary"
          tar -cJf "${{ matrix.package }}" -C "$(dirname "$binary")" vr-imageview

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
